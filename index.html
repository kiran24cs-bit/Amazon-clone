<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon-clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images-icons/amazon-logo.png"></link>
</head>
<body>
    <div class="Main-body">
        <header class="upper-head">
            <div class="upper-head-left">
                <img class="amazon-image" src="images-icons/amazon-image.png">
            </div>
            <div class="upper-head-middle">
                <input class="search-input" placeholder="Search">
                <button class="search"><img src="images-icons/search-button.png"></button>
            </div>
            <div class="upper-head-right">
                <button class="account">K</button>
                <button class="log-out">logout</button>
            </div>
        </header>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
